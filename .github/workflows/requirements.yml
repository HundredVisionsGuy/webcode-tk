name: Export Requirements

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Install Export Plugin (Required for Poetry 2.x)
        run: poetry self add poetry-plugin-export

      - name: Generate requirements.txt without hashes
        run: poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Verify requirements.txt is up to date
        run: |
          if ! git diff --quiet -- requirements.txt; then
            echo "requirements.txt is out of date. Run 'poetry export -f requirements.txt --output requirements.txt --without-hashes' and commit the result."
            git diff -- requirements.txt
            exit 1
          fi
