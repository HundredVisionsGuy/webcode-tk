name: Export Requirements

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Install Export Plugin (Required for Poetry 2.x)
        run: poetry self add poetry-plugin-export

      - name: Generate requirements.txt without hashes
        run: poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Create Pull Request if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto-update requirements.txt"
          title: "chore: auto-update requirements.txt"
          body: "Automatically generated pull request to update requirements.txt"
          branch: "update-requirements-txt"
          add-paths: "requirements.txt"
